services:
  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"

  stackport:
    image: davireis/stackport
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT_URL: http://ministack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: ap-south-1
